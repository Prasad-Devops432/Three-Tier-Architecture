server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets directly
    location / {
        # Fall back to index.html so client-side routes (/login, /register)
        # still load when the page is refreshed or opened directly
        try_files $uri $uri/ /index.html;
    }

    # Basic hardening: hide nginx version and block dotfiles
    server_tokens off;
    location ~ /\. {
        deny all;
    }
}
